<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="モンスターカード">
<meta name="theme-color" content="#6a4de0">
<meta name="color-scheme" content="light">
<title>モンスターカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#6A4DE0; --ink:#1E1B4B; --ink2:#5b5885; --card:#fff;
  --sun:#FFD23F; --ok:#1FB373; --ng:#F0525B; --p0:#FF8A3D; --p1:#23B5D3;
  --en:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;
  --ja:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --num:'Nunito','Arial Rounded MT Bold',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:var(--ja);color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(255,255,255,.13) 3px,transparent 4px),radial-gradient(circle,rgba(255,210,63,.35) 2px,transparent 3px);
  background-size:34px 34px,58px 58px;background-position:0 0,17px 21px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
.hidden{display:none!important}
.num{font-family:var(--num)}

/* 共通パーツ */
.title{margin:14px 0 4px;text-align:center;font-weight:900;font-size:clamp(34px,10vw,48px);color:#fff;letter-spacing:.02em;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 4px 0 var(--ink),-3px 4px 0 var(--ink)}
.quit{border:3px solid var(--ink);background:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:900;flex:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h2{flex:1;margin:0;color:#fff;font-size:20px;font-weight:900;line-height:1.2}
.big{display:block;width:100%;margin-top:16px;padding:16px;border:3px solid var(--ink);border-radius:18px;background:var(--sun);
  font-size:21px;font-weight:900;box-shadow:0 5px 0 var(--ink)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big:disabled{background:#ddd;color:#888;box-shadow:0 5px 0 #aaa;border-color:#aaa;cursor:default;transform:none}
.second{display:block;width:100%;margin-top:12px;padding:14px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-size:18px;font-weight:900}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:3px 12px 3px 4px;font-weight:900;font-size:16px}
.pchip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.pchip .av svg{width:120%;height:auto}
.pc0 .av,.av.pc0{background:var(--p0)} .pc1 .av,.av.pc1{background:var(--p1)}
.wallet{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 14px 4px 6px;font-family:var(--num);font-weight:900;font-size:19px;display:flex;align-items:center;gap:6px;flex:none}
.wallet svg{width:28px;height:28px}
.reset{display:block;margin:28px auto 0;background:none;border:none;color:rgba(255,255,255,.7);text-decoration:underline;font-size:14px}

/* ---------- プレイヤー選択 ---------- */
.ask{text-align:center;color:#fff;font-weight:900;font-size:22px;margin:18px 0 14px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 10px 14px;text-align:center;width:100%;min-width:0}
.pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pcard .av{flex:none;width:min(96px,24vw);height:min(96px,24vw);border-radius:20px;display:grid;place-items:center;overflow:hidden;border:3px solid var(--ink)}
.pcard .av svg{width:115%;height:auto}
.pcard .pn{font-size:20px;font-weight:900;display:block;margin-bottom:4px;word-break:break-all;line-height:1.2}
.pcard .ps{font-size:14px;font-weight:700;color:var(--ink2);display:block;line-height:1.6}
.pcard .ps b{font-family:var(--num);color:var(--ink);font-size:16px}
.edit{position:static;margin-top:2px;border:2px solid var(--ink);background:#fff;border-radius:10px;font-size:13px;font-weight:900;padding:3px 8px}
.nameedit{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.nameedit input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
.nameedit button{border:3px solid var(--ink);background:var(--sun);border-radius:12px;font-weight:900;padding:6px 12px}
.nameedit input{width:100%;font-size:17px}
.binderbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;padding:14px;border:3px solid var(--ink);border-radius:20px;
  background:linear-gradient(135deg,#B8342F,#7E1F24);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 var(--ink)}
.binderbtn small{font-family:var(--num);font-size:16px;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px}

/* ---------- ホーム ---------- */
.homebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.swap{border:3px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-weight:900;font-size:15px}
.got{text-align:center;color:#fff;font-weight:700;font-size:17px;margin:8px 0 16px}
.got b{font-family:var(--num);font-size:22px;color:var(--sun)}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.hbtn{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  padding:10px 12px;text-align:left;font-weight:900;font-size:16px;line-height:1.2}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hbtn .ic{flex:none;width:38px;height:38px}
.hbtn b{font-family:var(--num);font-size:21px}
.hbtn small{display:block;font-size:12px;color:var(--ink2);font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gsect{grid-column:1/-1;margin:18px 0 2px;text-align:center;font-weight:900;font-size:22px;color:#fff;letter-spacing:.03em;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.mcard{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 10px 12px;
  text-align:center;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:190px}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mcard .art{width:100%;aspect-ratio:1.35;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.mcard .art svg{width:78%;height:auto}
.mcard .name{font-weight:900;font-size:16px;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.meter{width:100%;height:10px;background:#E6E3F5;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.cnt{font-family:var(--num);font-weight:800;font-size:14px;color:var(--ink2)}
.stamp{position:absolute;top:8px;right:-6px;background:var(--sun);border:3px solid var(--ink);border-radius:10px;font-family:var(--num);font-weight:900;font-size:14px;padding:2px 8px;transform:rotate(10deg)}
.ribbon{position:absolute;top:8px;left:-6px;background:var(--ok);color:#fff;border:3px solid var(--ink);border-radius:10px;font-weight:900;font-size:13px;padding:2px 8px;transform:rotate(-8deg)}
.ribbon.miss{background:var(--ng)}

/* ---------- クイズ ---------- */
.bar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:16px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;border:3px solid var(--ink)}
.fill{height:100%;background:var(--sun);width:0;transition:width .3s}
.count{font-family:var(--num);font-weight:900;font-size:18px;color:#fff;min-width:56px;text-align:right}
.qcard{position:relative;margin:22px 0 18px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 16px 22px;text-align:center}
.qcard .mini{position:absolute;left:12px;top:-22px;width:62px}
.qcard .who{position:absolute;right:10px;top:-16px;transform:scale(.85);transform-origin:right top}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--ink2);background:#EEEAFE;border-radius:99px;padding:3px 12px}
.word{font-family:var(--en);font-weight:500;font-size:clamp(46px,14vw,70px);line-height:1.1;margin:12px 0 14px;word-break:break-word}
.say{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 18px;font-size:16px;font-weight:900}
.say svg{vertical-align:-3px;margin-right:4px}
.qcard.in{animation:qin .35s ease-out}
@keyframes qin{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:13px 14px;font-size:19px;font-weight:900;box-shadow:0 4px 0 var(--ink);min-height:62px}
.choice .n{flex:none;width:30px;height:30px;border-radius:9px;background:#EEEAFE;font-family:var(--num);font-weight:900;font-size:16px;display:grid;place-items:center}
.choice:disabled{cursor:default}
.choice.ok{background:var(--ok);color:#fff}
.choice.ng{background:var(--ng);color:#fff;animation:shake .35s}
.choice.ok .n,.choice.ng .n{background:rgba(255,255,255,.3)}
.choice.dim{color:#aaa6c8;border-color:#aaa6c8;box-shadow:0 4px 0 #aaa6c8}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:16px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 16px}
.feedback .msg{font-weight:900;font-size:19px;margin:0 0 6px}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)}
.ex{display:flex;gap:10px;align-items:flex-start;font-family:var(--en);font-weight:400;font-size:17px;line-height:1.5;margin:0}
.ex button{flex:none;border:none;background:#EEEAFE;border-radius:50%;width:34px;height:34px;display:grid;place-items:center}

/* ---------- 結果 ---------- */
.rbox{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:20px 16px;text-align:center;margin-top:10px}
.rbox .art{width:170px;margin:0 auto}
.rbox .art svg{width:100%;height:auto}
.rbox.clear .art{animation:mpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{from{transform:scale(.3) rotate(-15deg)}to{transform:none}}
.headline{font-size:26px;font-weight:900;margin:8px 0 4px}
.sub{font-weight:700;color:var(--ink2);margin:0 0 12px}
.score{font-family:var(--num);font-weight:900;font-size:20px}
.miss{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;text-align:left}
.miss li{display:flex;align-items:center;gap:12px;background:#F6F4FF;border-radius:12px;padding:8px 12px}
.miss .w{font-family:var(--en);font-weight:500;font-size:21px}
.miss .m{color:var(--ink2);flex:1;text-align:right;font-weight:700}
.miss button{border:none;background:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.coinbox{margin:14px auto 4px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px}
.coinbox svg{width:56px;height:56px;animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-80px) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.nextcoin{font-size:14px;font-weight:700;color:var(--ink2);margin:4px 0 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-220%);background:#fff;border:3px solid var(--ink);border-radius:99px;
  padding:6px 16px 6px 8px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;z-index:60;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.toast.on{transform:translate(-50%,0)}
.toast svg{width:34px;height:34px}

/* ---------- ショップ ---------- */
.shopbox{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 16px 20px;text-align:center}
.shopbox .packprev{width:min(180px,50vw);margin:4px auto 10px}
.shopbox .packprev svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(30,27,75,.25))}
.packname{font-size:22px;font-weight:900;margin:4px 0 2px}
.packdesc{font-weight:700;color:var(--ink2);margin:0 0 12px}
.slots{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.slots i{width:26px;height:36px;border-radius:6px;border:3px solid var(--ink);background:#EEEAFE}
.slots i.f{background:var(--bg)}
.slots i.r{background:linear-gradient(135deg,#FFD23F,#FF8FB1,#8FD3FF)}
.slotlabel{font-size:14px;font-weight:700;color:var(--ink2);margin:0}

/* ---------- 宇宙人カード ---------- */
.acard{position:relative;container-type:inline-size;aspect-ratio:5/7;border-radius:7%/5%;padding:3.6%;color:#1E1B4B;
  background:linear-gradient(160deg,#e3e9f5,#9fb0d3);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.acard.r2{background:linear-gradient(160deg,#d4fbe9,#2fc79c 55%,#1b9c7a)}
.acard.r3{background:linear-gradient(160deg,#FFF3B0,#F2C230 45%,#FFE58A 60%,#C99A12)}
.acard.r4,.acard.r5{background:linear-gradient(135deg,#ff9ad5,#ffd36e,#8ef0c0,#8fc8ff,#c69bff,#ff9ad5);background-size:300% 300%;animation:holo 4s linear infinite}
.acard.r5{background:linear-gradient(135deg,#1a1033,#6b2fd6 20%,#ff4fa8 40%,#ffd23f 55%,#3ee6c1 70%,#4a7dff 85%,#1a1033);background-size:300% 300%;animation:holo 2.6s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.ain{position:relative;height:100%;border-radius:4.5cqw;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.acard.r5 .ain{background:#fff8e1}
.ahead{display:flex;justify-content:space-between;align-items:baseline;padding:3cqw 4cqw 2cqw;font-weight:900}
.aname{font-size:9.5cqw;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ano{font-family:var(--num);font-size:6cqw;color:#8a86b5;flex:none;margin-left:2cqw}
.aart{flex:1;margin:0 3cqw;border-radius:3.5cqw;display:grid;place-items:center;overflow:hidden;position:relative;
  background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle at 30% 20%,#4a3fa8 0,#1a1650 75%);background-size:22% 22%,100% 100%}
.acard.r3 .aart{background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle at 50% 40%,#7a4bd6 0,#2a1a66 75%)}
.acard.r4 .aart{background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle at 50% 35%,#ff6fb5 0,#6b2fd6 50%,#1a1650 90%)}
.acard.r5 .aart{background-image:radial-gradient(circle,#fff 1.2px,transparent 1.8px),conic-gradient(from 0deg,#ff4fa8,#ffd23f,#3ee6c1,#4a7dff,#b06bff,#ff4fa8)}
.aart svg{width:88%;height:auto;position:relative}
.astars{text-align:center;font-size:7.5cqw;line-height:1;padding:2.2cqw 0 0;letter-spacing:.05em;color:#8a9bc0}
.acard.r2 .astars{color:#16a37f} .acard.r3 .astars{color:#E0A500} .acard.r4 .astars{color:#ff4fa8}
.acard.r5 .astars{background:linear-gradient(90deg,#ff4fa8,#ffb000,#18c7a0,#4a7dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.afoot{text-align:center;padding:1.4cqw 4cqw 2.6cqw;font-size:6cqw;font-weight:700;color:#5b5885}
.shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden}
.acard.r3 .shine::after,.acard.r4 .shine::after,.acard.r5 .shine::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.glit{position:absolute;inset:0;pointer-events:none}
.glit i{position:absolute;width:8cqw;height:8cqw;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
.acard.lock{background:rgba(255,255,255,.08);box-shadow:none;border:2px dashed rgba(255,255,255,.35)}
.acard.lock .ain{background:transparent;color:rgba(255,255,255,.55)}
.acard.lock .aart{background:rgba(0,0,0,.18)}
.acard.lock .astars{color:rgba(255,255,255,.35)}
.acard.lock .afoot,.acard.lock .ano{color:rgba(255,255,255,.45)}
.acnt{position:absolute;bottom:-6px;right:-6px;background:var(--ink);color:#fff;border:2px solid #fff;border-radius:99px;font-family:var(--num);font-weight:900;font-size:13px;padding:1px 8px;z-index:3}
.newb{position:absolute;top:-8px;right:-6px;background:var(--ng);color:#fff;border:2px solid #fff;border-radius:8px;font-family:var(--num);font-weight:900;font-size:12px;padding:1px 6px;z-index:3;transform:rotate(8deg)}
.fdot{position:absolute;top:-5px;left:-5px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;z-index:3}
.fdot.pc0{background:var(--p0)} .fdot.pc1{background:var(--p1)}

body{overflow-x:hidden}
.acard .num0{display:none}
.slotnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:900;color:#c3bfdc;font-size:clamp(13px,4.2vw,20px)}

/* =========================================================
   バインダー（めくれる）
   ========================================================= */
.binder2{position:relative;border-radius:14px 20px 20px 14px;padding:10px 10px 10px 30px;
  background:linear-gradient(135deg,#B8342F,#8A2428);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 0 0 5px rgba(255,255,255,.08)}
.binder2::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,220,180,.35);border-radius:12px;pointer-events:none}
.rings{position:absolute;left:4px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:26px 0;z-index:20;pointer-events:none}
.rings i{width:38px;height:18px;border-radius:11px;border:5px solid #d7dde5;border-left-color:#8d97a6;border-bottom-color:#9aa3b0;box-shadow:0 2px 2px rgba(0,0,0,.3)}
.book{position:relative;perspective:1800px;touch-action:pan-y}
.leaf{background:#F4F1FA;border-radius:4px 10px 10px 4px;box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.35)}
.book>.leaf.base{position:absolute;inset:0}
.book>.leaf.top{position:relative}
.turn{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;z-index:10;display:none;will-change:transform}
.turn.on{display:block}
.turn .tf,.turn .tb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.turn .tb{transform:rotateY(180deg);border-radius:10px 4px 4px 10px;
  background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 3px),rgba(120,110,180,.12) calc(25% - 3px) 25%),repeating-linear-gradient(0deg,transparent 0 calc(25% - 3px),rgba(120,110,180,.12) calc(25% - 3px) 25%),#ECE8F6}
.turn .tf::after,.turn .tb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sh,0)}
.turn .tf::after{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 60%,rgba(255,255,255,.25))}
.turn .tb::after{background:linear-gradient(270deg,rgba(0,0,0,.3),rgba(0,0,0,0) 70%)}
.book .cast{position:absolute;inset:0;pointer-events:none;z-index:9;border-radius:4px 10px 10px 4px;opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 70%)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.pocket{position:relative;border-radius:6px;padding:3px;background:rgba(160,150,210,.16);box-shadow:inset 0 0 0 1.5px rgba(120,110,180,.3);aspect-ratio:5/7}
.pocket::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;z-index:4;
  background:linear-gradient(125deg,rgba(255,255,255,.6) 0,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 85%,rgba(255,255,255,0) 100%)}
.pocket .acard{cursor:pointer;width:100%}
.pocket .acnt{font-size:10px;padding:0 5px;bottom:-4px;right:-4px}
.pocket .fdot{width:12px;height:12px;top:-3px;left:-3px}
.pocket.land .acard{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:scale(1.25)}to{transform:none}}
.pocket.target{box-shadow:inset 0 0 0 3px var(--sun),0 0 14px 3px var(--sun)}
.bnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:#fff;font-weight:900;font-size:17px}
.bnav button{color:var(--ink);border:3px solid var(--ink);background:#fff;border-radius:14px;width:60px;height:48px;font-size:22px;font-weight:900;box-shadow:0 4px 0 var(--ink)}
.bnav button:disabled{opacity:.4}
.rstat{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rstat span{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-family:var(--num);font-weight:900;font-size:13px}
.rstat span b{color:#E0A500}
.bhint{text-align:center;color:rgba(255,255,255,.8);font-size:13px;font-weight:700;margin:8px 0 0}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,12,45,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.modal .acard{width:min(290px,74vw);animation:mpop .45s cubic-bezier(.3,1.5,.5,1)}
.modal .info{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-weight:700;text-align:center;line-height:1.7}

/* =========================================================
   開封（ポケポケ風：明るい空間）
   ========================================================= */
#open{position:fixed;inset:0;z-index:50;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#d9e6fb 0,#eef4ff 50%,#dfe8fa 100%);transition:background .6s}
#open.bg3{background:linear-gradient(180deg,#ffe7a3 0,#fff6d8 50%,#ffe3a0 100%)}
#open.bg4{background:linear-gradient(180deg,#ffc2e6 0,#e9dcff 50%,#bfe6ff 100%)}
#open.bg5{background:conic-gradient(from 0deg at 50% 45%,#ff8fcf,#ffe27a,#8ff0d0,#8fb8ff,#d0a8ff,#ff8fcf)}
#open.shake{animation:scr .5s}
@keyframes scr{10%,50%,90%{transform:translate(-6px,3px)}30%,70%{transform:translate(6px,-3px)}}
.whiteout{position:absolute;inset:0;background:#fff;z-index:30;pointer-events:none;opacity:0;transition:opacity .45s}
.whiteout.on{opacity:1}
.floor{position:absolute;left:0;right:0;top:57%;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.3) 40%,rgba(210,225,250,.2))}
.floor::before{content:"";position:absolute;left:10%;right:10%;top:-30px;height:60px;background:radial-gradient(ellipse,rgba(255,255,255,1),rgba(255,255,255,0) 70%)}
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#bfe3ff;box-shadow:0 0 8px 3px rgba(150,210,255,.8);animation:mote linear infinite}
@keyframes mote{to{transform:translateY(-110vh)}}
.skip{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:46px;height:46px;border-radius:50%;border:2px solid #fff;
  background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(40,60,120,.25);font-size:18px;color:#56607a;z-index:25}
.ohead{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);text-align:center;font-weight:900;font-size:17px;color:#46506a;z-index:12}

/* カルーセル */
.carousel{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 42%}
.ring{position:absolute;left:50%;top:42%;width:0;height:0;transform-style:preserve-3d}
.ring.intro{animation:ringIn 1.8s cubic-bezier(.15,.7,.25,1) both}
@keyframes ringIn{from{transform:translateY(-55vh) translateZ(calc(var(--R)*-1)) rotateY(-600deg) rotateX(35deg) scale(.5)}to{transform:translateZ(calc(var(--R)*-1)) rotateY(0deg)}}
.cpack{position:absolute;width:var(--cw);height:calc(var(--cw)*1.5);left:calc(var(--cw)*-.5);top:calc(var(--cw)*-.75);transform-style:preserve-3d;transition:opacity .4s}
.cpack .spin{position:absolute;inset:0;transform-style:preserve-3d}
.cpack.front .spin{animation:pspin 7s linear infinite}
@keyframes pspin{to{transform:rotateY(360deg)}}
.cpack .f,.cpack .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 6px 10px rgba(40,50,110,.3))}
.cpack .b{transform:rotateY(180deg)}
.cpack svg{width:100%;height:100%;display:block}
.cpack .refl{position:absolute;left:0;right:0;top:calc(100% + 8px);height:60%;overflow:hidden;opacity:.3;transform:scaleY(-1);
  -webkit-mask:linear-gradient(to top,#000,transparent 70%);mask:linear-gradient(to top,#000,transparent 70%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cpack .refl .rin{position:absolute;left:0;right:0;bottom:0;height:166.7%}
.cpack .glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);background-size:250% 100%;animation:glint 2.8s ease-in-out infinite;mix-blend-mode:screen;backface-visibility:hidden}
@keyframes glint{from{background-position:120% 0}to{background-position:-120% 0}}
.carousel.leave .cpack:not(.front){opacity:0}
.carousel.leave .cpack.front{opacity:0;transition-delay:.25s}
.chint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 90px);text-align:center;color:#46506a;font-weight:900;font-size:17px;z-index:12}
.chint small{display:block;font-size:13px;color:#7a84a0;margin-top:4px}

/* 開ける */
.stage{position:absolute;inset:0}
.ohint{position:absolute;left:0;right:0;top:16%;color:#46506a;font-weight:900;font-size:18px;text-align:center;margin:0 16px}
.pack{--pw:min(320px,80vw);position:absolute;left:50%;top:30%;width:var(--pw);height:calc(var(--pw)*1.5);margin-left:calc(var(--pw)*-.5)}
.pack.enter{animation:pEnter .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pEnter{from{transform:translateY(-12%) scale(.55);opacity:0}to{transform:none;opacity:1}}
.ptop,.pbody{position:absolute;left:0;right:0;overflow:hidden}
.ptop{top:0;height:16%;transform-origin:0 100%;z-index:2}
.pbody{top:16%;bottom:0}
.pinner{position:absolute;left:0;width:100%;height:calc(var(--pw)*1.5)}
.pinner svg{width:100%;height:100%;display:block}
.ptop .pinner{top:0}
.pbody .pinner{top:calc(var(--pw)*-.24)}
.cutline{position:absolute;left:3%;right:3%;top:16%;height:0;border-top:3px dashed rgba(255,255,255,.85);transform:translateY(-1px);z-index:3}
.cutline::after{content:"";position:absolute;top:-6px;left:0;width:30%;height:10px;border-radius:9px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(1px);animation:cutglint 1.6s ease-in-out infinite}
@keyframes cutglint{from{left:-30%}to{left:100%}}
.cutline i{position:absolute;left:0;top:-5px;height:8px;width:0;background:#fff;border-radius:9px;box-shadow:0 0 12px 4px #9ff,0 0 26px 10px rgba(255,255,255,.8)}
.finger{position:absolute;top:calc(16% - 22px);left:0;font-size:34px;animation:swipe 1.8s ease-in-out infinite;pointer-events:none;z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
@keyframes swipe{0%{left:-6%;opacity:0}15%{opacity:1}80%{left:82%;opacity:1}100%{left:86%;opacity:0}}
.pack.torn .cutline,.pack.torn .finger,.pack.cutting .finger,.pack.cutting .cutline::after{display:none}
.pack.torn .ptop{animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{to{transform:translate(85%,-190%) rotate(42deg);opacity:0}}
.pack.torn .pbody{animation:glowshake .5s ease-in-out}
@keyframes glowshake{20%{transform:translateX(-5px) rotate(-1.5deg)}40%{transform:translateX(5px) rotate(1.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.beam{position:absolute;left:6%;right:6%;bottom:84%;height:0;border-radius:50% 50% 0 0;pointer-events:none;z-index:1;
  background:linear-gradient(to top,#fff,rgba(255,255,255,.7) 40%,transparent);filter:blur(5px)}
.pack.torn .beam{animation:beam 1.1s ease-out forwards}
@keyframes beam{0%{height:0;opacity:0}30%{height:170%;opacity:1}100%{height:240%;opacity:0}}
.pack.out .pbody{transition:transform .6s ease-in,opacity .6s;transform:translateY(100%);opacity:0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:29}
.flash.on{animation:flash .7s ease-out}
@keyframes flash{12%{opacity:1}to{opacity:0}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:28;overflow:hidden}
.pt{position:absolute;border-radius:50%;animation:pt var(--t,.9s) cubic-bezier(.1,.7,.3,1) forwards}
.pt.star{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes pt{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(200deg);opacity:0}}
.cf{position:absolute;top:-24px;width:10px;height:16px;animation:fall var(--t,2.6s) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--rot))}}

/* 1まいずつ */
.reveal{position:absolute;inset:0;z-index:15}
.rays{position:absolute;left:50%;top:46%;width:820px;height:820px;margin:-410px 0 0 -410px;pointer-events:none;opacity:0;transition:opacity .4s;
  background:repeating-conic-gradient(rgba(255,255,255,.75) 0 9deg,transparent 9deg 18deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 16%,transparent 66%);mask:radial-gradient(circle,#000 16%,transparent 66%);animation:spin 12s linear infinite}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{position:absolute;left:0;right:0;top:9%;min-height:44px;font-weight:900;font-size:32px;color:#fff;text-align:center;letter-spacing:.04em;z-index:3;
  text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.banner.on{animation:bannerIn .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes bannerIn{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
.stack{--cw:min(270px,68vw);position:absolute;left:50%;top:46%;width:var(--cw);aspect-ratio:5/7;transform:translate(-50%,-50%)}
.stack.rise{animation:shoot .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes shoot{0%{transform:translate(-50%,10%) scale(.5);opacity:0}25%{opacity:1}60%{transform:translate(-50%,-56%) scale(1.05)}100%{transform:translate(-50%,-50%)}}
.fc{position:absolute;inset:0;perspective:1100px;will-change:transform}
.fc.anim{transition:transform .38s cubic-bezier(.4,.1,.3,1),opacity .38s}
.fcin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.fc.down .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .acard{width:100%;box-shadow:0 10px 24px rgba(40,50,110,.3)}
.face .newb{left:-8px;right:auto;transform:rotate(-8deg);font-size:14px;padding:2px 8px}
.aback{width:100%;height:100%;border-radius:17px;overflow:hidden;box-shadow:0 10px 24px rgba(40,50,110,.3)}
.aback svg{width:100%;height:100%;display:block}
.fc.aura3 .aback{animation:aura3 1s ease-in-out infinite}
.fc.aura4 .aback,.fc.aura5 .aback{animation:aura4 1s linear infinite}
.fc.charge .fcin{animation:charge .12s linear infinite}
@keyframes aura3{50%{box-shadow:0 0 34px 14px rgba(255,190,20,.95)}0%,100%{box-shadow:0 0 16px 5px rgba(255,190,20,.7)}}
@keyframes aura4{0%{box-shadow:0 0 30px 12px #ff4fa8}33%{box-shadow:0 0 30px 12px #ffd23f}66%{box-shadow:0 0 30px 12px #3ee6c1}100%{box-shadow:0 0 30px 12px #ff4fa8}}
@keyframes charge{50%{transform:rotateY(180deg) translate(3px,-2px) rotate(1deg)}0%,100%{transform:rotateY(180deg)}}
.fc.pop .face.front{animation:fpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes fpop{from{transform:scale(.88)}to{transform:none}}
.bigstars{position:absolute;left:0;right:0;top:calc(46% + min(270px,68vw)*.7 + 14px);display:flex;justify-content:center;gap:4px;font-size:30px;line-height:1;z-index:3}
.bigstars span{color:#FFD23F;text-shadow:0 2px 0 var(--ink),0 0 12px rgba(255,210,63,.9);animation:sp .4s cubic-bezier(.3,1.8,.5,1) both}
@keyframes sp{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.ocount{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 30px);text-align:center;color:#46506a;font-weight:900;font-size:15px;z-index:3}

/* けっか */
.summary{position:absolute;inset:0;overflow:auto;padding:70px 18px 30px;display:flex;flex-direction:column;align-items:center;z-index:16}
.summary .ttl{font-weight:900;font-size:20px;color:#46506a;margin:0 0 4px;padding:6px 40px;border-bottom:3px solid;border-image:linear-gradient(90deg,transparent,#8fb8ff,#ff8fcf,transparent) 1}
.sgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:380px;margin-top:20px}
.sgrid .sc{position:relative;width:calc((100% - 24px)/3)}
.sgrid .sc .acard{width:100%;animation:mpop .5s cubic-bezier(.3,1.6,.5,1) both}
.sgrid .sc .newb{left:-6px;right:auto}
.sgrid .own{position:absolute;left:4px;bottom:-9px;background:#46506a;color:#fff;border-radius:6px;font-family:var(--num);font-weight:900;font-size:12px;padding:1px 8px;z-index:4}
.pill{display:block;margin:28px auto 0;min-width:180px;padding:12px 30px;border-radius:99px;border:3px solid #7fe0ea;background:linear-gradient(180deg,#fff,#e6f7fb);
  color:#35607a;font-weight:900;font-size:18px;box-shadow:0 0 0 3px rgba(127,224,234,.3),0 4px 12px rgba(40,80,120,.2)}
.pill:disabled{opacity:.5}
.pill.sub{border-color:#c9d2e6;color:#56607a;font-size:16px;margin-top:12px;box-shadow:none}

/* バインダーへ（とんでいく） */
.flyer{position:absolute;z-index:26;border-radius:8px;overflow:hidden;box-shadow:0 6px 14px rgba(40,50,110,.35);pointer-events:none}
.flyer svg{width:100%;height:100%;display:block}
.dock{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 70px);background:rgba(255,255,255,.85);box-shadow:0 -2px 12px rgba(40,50,110,.12);z-index:24;
  display:flex;justify-content:center;align-items:flex-start;padding-top:10px;transform:translateY(100%);transition:transform .35s}
.dock.on{transform:none}
.dock .bicon{width:52px;height:44px;border-radius:10px;background:linear-gradient(135deg,#B8342F,#8A2428);border:3px solid var(--ink);position:relative;display:grid;place-items:center;font-size:22px}
.dock .bicon.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}
.lifetime{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) scale(0);background:#fff;border-radius:16px;padding:6px 22px;text-align:center;
  box-shadow:0 4px 14px rgba(40,50,110,.2);z-index:25;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.lifetime.on{transform:translateX(-50%) scale(1)}
.lifetime small{display:block;font-size:11px;font-weight:700;color:#7a84a0}
.lifetime b{font-family:var(--num);font-size:24px;color:#46506a}

/* とうろく */
.reg{position:absolute;inset:0;z-index:17;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px;display:flex;flex-direction:column;align-items:center}
.reg .rhead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.reg .rhead .bi{width:40px;height:34px;border-radius:8px;background:linear-gradient(135deg,#B8342F,#8A2428);border:3px solid var(--ink)}
.reg .rhead b{font-weight:900;font-size:19px;color:#46506a}
.reg .rcount{font-family:var(--num);font-weight:900;font-size:16px;background:#fff;border-radius:99px;padding:2px 14px;color:#46506a;box-shadow:0 2px 6px rgba(40,50,110,.15)}
.reg .rcount.bump{animation:bump .3s}
.reg .binder2{width:min(100%,420px)}
.regcard{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);width:min(200px,52vw);transform:translateX(-50%);z-index:22;touch-action:none}
.regcard .acard{width:100%;box-shadow:0 12px 30px rgba(40,50,110,.4)}
.regcard.in{animation:regIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes regIn{from{transform:translate(-50%,60%);opacity:0}}
.reghint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 30px + min(200px,52vw)*1.4 + 14px);z-index:22;
  background:#fff;border-radius:16px;padding:8px 18px;font-weight:900;font-size:14px;color:#46506a;box-shadow:0 4px 14px rgba(40,50,110,.2);white-space:nowrap;text-align:center}
.reghint::after{content:"︿";display:block;font-size:18px;line-height:1;margin-top:2px;animation:upar 1s ease-in-out infinite;color:#7a84a0}
@keyframes upar{50%{transform:translateY(-5px)}}
.regdim{position:absolute;inset:0;background:rgba(40,50,110,.25);z-index:21;transition:opacity .3s}
.milestone{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:27;background:#fff;border-radius:22px;padding:14px 26px;text-align:center;
  box-shadow:0 0 0 4px #FFD23F,0 10px 30px rgba(40,50,110,.35);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.milestone.on{transform:translate(-50%,-50%) scale(1)}
.milestone b{display:block;font-size:22px;font-weight:900;color:#E0A500}
.milestone span{font-weight:700;color:#46506a}
.regdone{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:23}
@media (prefers-reduced-motion:reduce){.ring.intro,.cpack.front .spin,.rays,.acard.r4,.acard.r5,.shine::after,.glit i,.motes i,.cutline::after,.cpack .glint{animation:none!important}}


/* =========================================================
   せってい
   ========================================================= */
.gear{display:block;margin:26px auto 0;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:8px 18px;font-weight:900;font-size:15px}
.pinbox{position:fixed;inset:0;z-index:90;background:rgba(15,12,45,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.pinbox h3{color:#fff;font-size:22px;font-weight:900;margin:0 0 16px}
.dots{display:flex;gap:16px;margin-bottom:24px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #fff}
.dots i.f{background:#fff}
.dots.ng{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:76px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-family:var(--num);font-weight:900;font-size:28px;box-shadow:0 4px 0 var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .ghost{background:transparent;border:none;box-shadow:none;color:#fff;font-size:16px;font-family:var(--ja)}
.pinmsg{color:#ffb3b8;font-weight:700;min-height:1.4em;margin:12px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:3px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.6);font-weight:900;font-size:15px}
.tabs button[aria-selected="true"]{background:#fff;box-shadow:0 4px 0 var(--ink)}
.panel{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:14px;margin-bottom:14px}
.panel h4{margin:0 0 10px;font-size:17px;font-weight:900}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ECE9F7}
.srow:first-of-type{border-top:none}
.srow .lb{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.srow .lb small{display:block;color:var(--ink2);font-size:12px}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button,.sbtn{border:2px solid var(--ink);background:#fff;border-radius:10px;min-width:38px;height:36px;font-weight:900;font-size:15px;padding:0 8px}
.stp .v{min-width:54px;text-align:center;font-family:var(--num);font-weight:900;font-size:17px}
.stp input{width:78px;height:36px;border:2px solid var(--ink);border-radius:10px;text-align:center;font-family:var(--num);font-weight:900;font-size:17px}
.nameinp{width:100%;font:inherit;font-size:18px;font-weight:900;border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn.warn{border-color:#c7303a;color:#c7303a}
.sbtn.wide{grid-column:1/-1}
.sbtn{height:auto;min-height:40px;padding:6px 8px;font-size:14px}
.gmini{width:30px;height:28px;flex:none}
.gmini svg{width:100%;height:100%}
.gbar{height:6px;background:#E6E3F5;border-radius:9px;margin-top:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok)}
.cmini{width:40px;flex:none}
.cmini .acard{width:100%;box-shadow:none}
.saved{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:99px;padding:8px 18px;font-weight:900;z-index:95;transition:transform .3s}
.saved.on{transform:translateX(-50%)}
.danger{margin-top:6px}


/* ---------- ずかん ---------- */
.topbar .wallet{font-size:16px;padding:4px 12px}
.dexpanel{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px}
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dslot{position:relative;aspect-ratio:5/7;border-radius:7px;min-width:0;background:linear-gradient(#F3F5FB,#E6E9F4);box-shadow:inset 0 0 0 1.5px #D5DAEA}
.dslot .slotnum{color:#b4bbd4;font-size:clamp(12px,3.6vw,18px)}
.dslot .acard{width:100%;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.dslot .acnt{font-size:9px;padding:0 4px;bottom:-4px;right:-4px;border-width:1.5px}
.dslot .fdot{width:10px;height:10px;top:-3px;left:-3px;border-width:1.5px}
.dslot.land .acard{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
.dslot.target{box-shadow:inset 0 0 0 3px var(--sun),0 0 12px 3px var(--sun)}
.reg{height:100%}
.regdex{flex:1;min-height:0;width:100%;max-width:460px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.8);border-radius:16px;padding:8px 8px 48vh;box-shadow:0 2px 10px rgba(40,50,110,.12)}

/* =========================================================
   カード（ノーマル / ex / メガex）
   ========================================================= */
.ahead{display:flex;align-items:center;gap:1.2cqw;padding:3cqw 3.5cqw 1.8cqw}
.aname{flex:1;min-width:0;font-size:8.2cqw}
.ahp{font-family:var(--num);font-weight:900;font-size:8cqw;color:#c7303a;white-space:nowrap;line-height:1}
.ahp small{font-size:4.4cqw;margin-right:.4cqw}
.atype{font-size:6.6cqw;line-height:1}
.aatk{display:flex;justify-content:space-between;align-items:center;gap:2cqw;margin:2cqw 3.5cqw 0;padding:1.6cqw 2.6cqw;border-radius:2.6cqw;background:#F3F1FA;font-size:5.4cqw;font-weight:900;white-space:nowrap}
.aatk span{overflow:hidden;text-overflow:ellipsis}
.aatk b{font-family:var(--num);font-size:7.4cqw}
.afoot{display:flex;justify-content:space-between;align-items:center;padding:1.6cqw 4cqw 2.2cqw;font-size:5.6cqw}
.afoot .astars{padding:0;text-align:left;font-size:6.4cqw;letter-spacing:0}
.exl{font-family:var(--num);font-style:italic;font-weight:900;font-size:11.5cqw;margin-left:.8cqw;line-height:.9;
  background:linear-gradient(180deg,#fff 15%,#FFE27A 55%,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.5cqw #1E1B4B}
.acard.r3{background:linear-gradient(135deg,#f6f8fc,#aeb9cf 28%,#ffffff 48%,#8e9ab3 70%,#eef1f7)}
.acard.r4{background:linear-gradient(135deg,#FFF3B0,#E6B422 28%,#FFF8D6 48%,#C99A12 70%,#FFE58A);animation:none}
.ain.full{background:#333;overflow:hidden}
.ain.full::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0 5deg,transparent 5deg 13deg);
  -webkit-mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 60%);mask:radial-gradient(circle at 50% 42%,#000 10%,transparent 60%)}
.ain.full .fart{position:absolute;left:-8%;right:-8%;top:7%;bottom:17%;display:grid;place-items:center}
.ain.full .fart svg{width:100%;height:auto;filter:drop-shadow(0 2cqw 2.4cqw rgba(0,0,0,.4))}
.ain.full>*:not(.fart){position:relative;z-index:2}
.ain.full .spacer,.acard.mega .spacer{flex:1}
.ain.full .aname,.ain.full .ahp{color:#fff;text-shadow:0 0 1cqw #1E1B4B,.5cqw .5cqw 0 #1E1B4B,-.5cqw .5cqw 0 #1E1B4B,.5cqw -.5cqw 0 #1E1B4B,-.5cqw -.5cqw 0 #1E1B4B}
.ain.full .aatk{background:rgba(255,255,255,.82)}
.ain.full .afoot{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.15));color:#fff}
.ain.full .afoot .ano{color:#fff}
.ain.full .astars{color:#FFE27A!important;text-shadow:0 0 1cqw #1E1B4B}
.foil{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;z-index:3;
  background:linear-gradient(115deg,transparent 12%,#ff4fa8 22%,#ffd23f 30%,#3ee6c1 38%,#4a7dff 46%,#b06bff 54%,transparent 64%),
    radial-gradient(circle,rgba(255,255,255,.9) .5px,transparent 1.4px);background-size:300% 300%,9% 6.4%;animation:foil 3.4s linear infinite}
.acard.r4 .foil{opacity:.65}
@keyframes foil{from{background-position:0% 50%,0 0}to{background-position:100% 50%,0 0}}

/* メガ ex */
.acard.mega{background:none!important;padding:0;box-shadow:none!important;transform-style:preserve-3d;animation:none}
.acard.mega .l{position:absolute;border-radius:7%/5%}
.acard.mega .frame{inset:0;background:linear-gradient(135deg,#ff4fa8,#ffd23f,#3ee6c1,#4a7dff,#b06bff,#ff4fa8);background-size:300% 300%;animation:holo 3s linear infinite;
  box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 5cqw rgba(255,200,60,.7)}
.acard.mega .frame::after{content:"";position:absolute;inset:2.4%;border-radius:6%/4.3%;border:1.1cqw solid #FFD23F;box-shadow:inset 0 0 0 .6cqw #fff6c9,0 0 0 .6cqw #fff6c9}
.acard.mega .bg{inset:4.2%;overflow:hidden;border-radius:5%/3.6%}
.acard.mega .bg .rays2{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0 6deg,transparent 6deg 12deg,rgba(255,230,120,.25) 12deg 18deg,transparent 18deg 26deg);animation:spin 9s linear infinite}
.acard.mega .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 1px,transparent 1.8px);background-size:10% 7%;opacity:.7}
.acard.mega .mon{left:3%;right:3%;top:10%;bottom:22%;display:grid;place-items:center;transform:translateZ(26px);pointer-events:none;border-radius:0}
.acard.mega .mon>svg:not(.kyoscene){width:104%;height:auto;filter:drop-shadow(0 3cqw 3cqw rgba(0,0,0,.5))}
.acard.mega .txt{inset:4.2%;display:flex;flex-direction:column;transform:translateZ(44px);background:transparent!important;overflow:visible;height:auto}
.acard.mega .txt::before{display:none}
.mega-rb{align-self:flex-start;margin:2.2cqw 0 -1cqw 3cqw;font-family:var(--num);font-weight:900;font-style:italic;font-size:5.4cqw;color:#fff;letter-spacing:.12em;
  background:linear-gradient(90deg,#8a3dff,#ff4fa8,#ffb000);padding:.4cqw 3cqw;border-radius:99px;border:.5cqw solid #fff;box-shadow:0 0 2cqw rgba(255,80,200,.8)}
.acard.mega .foil{inset:0;opacity:.6;transform:translateZ(22px)}
.acard.mega .glare{inset:0;pointer-events:none;mix-blend-mode:overlay;transform:translateZ(56px);
  background:radial-gradient(circle at var(--gx,30%) var(--gy,18%),rgba(255,255,255,.85),transparent 42%)}
.acard.mega .glit{transform:translateZ(58px);z-index:4}
.acard.mega>.newb,.acard.mega>.acnt,.acard.mega>.fdot{transform:translateZ(60px)}
.acard.exc .aname{font-size:7.2cqw}
.acard.mega .aname{font-size:6.2cqw}
.acard.exc .exl,.acard.mega .exl{font-size:10cqw}
.acard.exc .ahp,.acard.mega .ahp{font-size:7cqw}
.fc .acard.mega,.modal .acard.mega,.regstack .acard.mega,.fly3d .acard.mega{animation:megaSway 5s ease-in-out infinite}
.acard.mega.tilting{animation:none!important;transition:transform .08s}
@keyframes megaSway{0%,100%{transform:perspective(800px) rotateY(-14deg) rotateX(6deg)}50%{transform:perspective(800px) rotateY(14deg) rotateX(-6deg)}}

/* =========================================================
   開封（動画風）
   ========================================================= */
#open.bg3{background:linear-gradient(180deg,#cfd0ff 0,#b8c4ff 50%,#9fb3f5 100%)}
#open.bg4{background:linear-gradient(180deg,#b9a6ff 0,#8f86f0 45%,#6fa0ef 100%)}
.pack{--pw:min(340px,90vw);top:44%}
.ohint{top:auto;bottom:calc(58% + 14px);font-size:14px;color:#6b7690;opacity:0;transition:opacity .4s}
.ohint.on{opacity:1}
.dimcut{position:absolute;inset:0;background:#1a2340;opacity:0;pointer-events:none;transition:opacity .15s}
.ptop,.pbody{filter:brightness(calc(1 - var(--dimv,0)*.45))}
.cutline i{background:#b6ffd8;box-shadow:0 0 12px 5px #52ffa8,0 0 28px 12px rgba(120,255,190,.7)}
.rbeam{position:absolute;left:50%;bottom:84%;width:220%;height:260%;margin-left:-110%;pointer-events:none;opacity:0;z-index:1;transform-origin:50% 100%;
  background:conic-gradient(from -55deg at 50% 100%,transparent 0deg,rgba(255,80,160,.55) 6deg,transparent 12deg,rgba(255,220,80,.6) 20deg,transparent 28deg,rgba(80,255,200,.55) 38deg,transparent 46deg,rgba(90,160,255,.6) 56deg,transparent 64deg,rgba(190,110,255,.55) 74deg,transparent 82deg,rgba(255,255,255,.7) 92deg,transparent 100deg,rgba(255,120,120,.5) 108deg,transparent 110deg);
  -webkit-mask:radial-gradient(ellipse at 50% 100%,#000 12%,transparent 62%);mask:radial-gradient(ellipse at 50% 100%,#000 12%,transparent 62%);filter:blur(2px)}
.pack.torn .rbeam{animation:rbeam 1.3s ease-out forwards}
@keyframes rbeam{0%{opacity:0;transform:scaleY(.2)}25%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.15)}}
.pack.torn .beam{animation:none;display:none}
.pack.out .pbody{transition:transform .7s ease-in,opacity .7s}
.fc.wait{opacity:0;pointer-events:none}
.fc.riseup{animation:riseup .75s cubic-bezier(.2,1.1,.4,1) both}
@keyframes riseup{from{transform:translateY(62%) scale(.82)}to{transform:none}}
.fc.enter{animation:cin .35s ease-out both}
@keyframes cin{from{opacity:0;transform:scale(.93)}}
.fc.swing .fcin{animation:swing3d .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes swing3d{0%{transform:translateX(70%) rotateY(-80deg) rotateX(24deg) scale(.7);opacity:0}45%{transform:rotateY(24deg) rotateX(-9deg) scale(1.06);opacity:1}75%{transform:rotateY(-7deg) rotateX(3deg)}100%{transform:none}}
.fc .face .newb{opacity:0}
.fc.landed .face .newb{animation:newpop .4s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes newpop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.flare{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;z-index:27;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.9) 8%,rgba(255,255,255,0) 40%),linear-gradient(90deg,transparent 47%,#fff 50%,transparent 53%),linear-gradient(0deg,transparent 47%,#fff 50%,transparent 53%);
  animation:flare .9s ease-out forwards}
@keyframes flare{0%{transform:scale(0) rotate(0);opacity:1}40%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.4) rotate(90deg);opacity:0}}
.swipehint{position:absolute;left:0;right:0;top:46%;display:flex;justify-content:space-between;padding:0 6px;pointer-events:none;z-index:2;opacity:0;transition:opacity .4s;
  color:rgba(255,255,255,.95);font-size:26px;font-weight:900;text-shadow:0 1px 4px rgba(40,60,120,.4)}
.swipehint.on{opacity:1}
.swipehint span{animation:nudge 1.2s ease-in-out infinite}
.swipehint span:last-child{animation-direction:reverse}
@keyframes nudge{50%{transform:translateX(-5px)}}

/* これまでに ゲットした カード */
.ach{position:absolute;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 14px 20px;overflow:hidden}
.achlbl{background:#56607a;color:#fff;border-radius:99px;font-size:12px;font-weight:900;padding:3px 12px}
.achnum{font-family:var(--num);font-weight:900;color:#3a4460;margin:2px 0 0;display:flex;align-items:baseline;gap:4px}
.achnum b{font-size:52px;line-height:1}
.achnum span{font-size:18px}
.achstamp{font-weight:900;font-size:24px;color:#18c7a0;letter-spacing:.06em;text-shadow:0 2px 0 #fff,0 0 12px rgba(24,199,160,.4);transform:scale(0) rotate(-8deg);transition:transform .45s cubic-bezier(.3,1.8,.5,1);margin-top:-2px}
.achstamp.on{transform:scale(1) rotate(-6deg)}
.achgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:100%;max-width:440px;margin-top:10px;max-height:46vh;overflow:hidden}
.achgrid .acard{width:100%}
.achgrid .pop{animation:mpop .5s cubic-bezier(.3,1.6,.5,1) both}
.tips{position:relative;width:100%;max-width:420px;margin-top:14px;background:#fff;border-radius:18px;padding:18px 14px 14px;display:flex;gap:12px;align-items:center;
  box-shadow:0 4px 16px rgba(40,50,110,.15),0 0 0 3px #d6f3f6}
.tips::before{content:"TIPS";position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:linear-gradient(90deg,#ff8fcf,#8fb8ff,#6fe3d0);color:#fff;font-family:var(--num);font-weight:900;font-size:13px;padding:2px 18px;border-radius:99px;letter-spacing:.1em}
.tips .tmon{width:70px;flex:none}
.tips p{margin:0;font-weight:700;color:#3a4460;line-height:1.6;font-size:14px}
.tips b{font-family:var(--en);font-size:18px;color:#1f6fe0}
.tips button{flex:none;border:none;background:#EEF3FF;border-radius:50%;width:40px;height:40px;font-size:18px}
.tapnext{margin-top:auto;color:#7a84a0;font-weight:700;font-size:14px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* 5まい いっしょに とうろく */
.regstack{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 34px);width:min(190px,50vw);aspect-ratio:5/7;transform:translateX(-50%);z-index:22;touch-action:none}
.regstack .rs{position:absolute;inset:0;transform:translate(calc(var(--j)*7px),calc(var(--j)*-6px)) rotate(calc(var(--j)*2.5deg))}
.regstack .acard{width:100%;box-shadow:0 10px 26px rgba(40,50,110,.35)}
.regstack.in{animation:regIn .45s cubic-bezier(.2,1.3,.4,1)}
.reghint{bottom:calc(env(safe-area-inset-bottom) + 34px + min(190px,50vw)*1.4 + 18px);font-size:13px;line-height:1.5}
.regpop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);z-index:27;background:#fff;border-radius:40px;padding:16px 26px;min-width:250px;
  box-shadow:0 10px 30px rgba(40,50,110,.3);transition:transform .4s cubic-bezier(.3,1.6,.5,1);text-align:center}
.regpop.on{transform:translate(-50%,-50%) scale(1)}
.regpop .t{font-weight:900;color:#3a4460;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.regpop .t b{font-family:var(--num);font-size:22px;min-width:40px;background:#F1F4FA;border-radius:10px;padding:0 8px}
.regpop .bar{height:8px;background:#E6EAF3;border-radius:9px;overflow:hidden;margin-top:10px}
.regpop .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fe3d0,#8fb8ff);transition:width 1s ease-out}
.regpop .ms{display:block;margin-top:8px;color:#E0A500;font-weight:900}

/* =========================================================
   パックショップ（動画風）
   ========================================================= */
#shop{position:relative;z-index:0;display:flex;flex-direction:column;align-items:center;min-height:calc(100vh - 34px)}
.shopbg{position:fixed;inset:0;z-index:-1;background:linear-gradient(158deg,#1690c8 0,#3cc3e2 36%,rgba(255,255,255,0) 36.3%),linear-gradient(180deg,#f2f6fb,#e4ebf5)}
#shop.sp .shopbg{background:linear-gradient(158deg,#ff5fa8 0,#ffc93f 36%,rgba(255,255,255,0) 36.3%),linear-gradient(180deg,#fff8ee,#fdeee0)}
.shoptop{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.packstage{position:relative;width:min(240px,60vw);margin:30px auto 8px;animation:float 3s ease-in-out infinite}
.packstage svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 18px rgba(20,40,90,.35))}
.pshine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:250% 100%;animation:glint 3.2s ease-in-out infinite;mix-blend-mode:screen}
#shop .packname{font-size:19px;font-weight:900;color:#2b3a55;margin:10px 0 14px;text-shadow:0 1px 0 #fff}
.openbtn{min-width:230px;padding:14px 36px;border-radius:99px;border:3px solid #fff;background:linear-gradient(180deg,#72ebf7,#1fbad3);color:#fff;font-size:22px;font-weight:900;letter-spacing:.12em;
  box-shadow:0 0 0 3px #5fd3e4,0 8px 18px rgba(30,160,200,.45);text-shadow:0 2px 0 rgba(0,90,120,.35)}
.openbtn:active{transform:translateY(2px)}
.openbtn:disabled{background:#c9d2e0;box-shadow:0 0 0 3px #b8c2d3;letter-spacing:0;font-size:17px}
.price{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:900;color:#3a4a66;margin:12px 0 4px}
.price svg{width:24px;height:24px}
#shop .slots i{width:20px;height:28px;border-width:2.5px}
@media (prefers-reduced-motion:reduce){.foil,.acard.mega .bg .rays2,.fc .acard.mega,.modal .acard.mega,.packstage,.pshine,.swipehint span{animation:none!important}}


/* ---------- 3つのパック ---------- */
.ptabs{display:flex;gap:10px;justify-content:center;margin:14px 0 4px;background:rgba(255,255,255,.55);border-radius:16px;padding:8px 12px;box-shadow:0 2px 10px rgba(20,40,90,.12)}
.ptab{width:54px;border:none;background:none;padding:0;border-radius:6px;opacity:.55;transition:transform .2s,opacity .2s}
.ptab svg{width:100%;height:auto;display:block;border-radius:3px;filter:drop-shadow(0 3px 4px rgba(20,40,90,.3))}
.ptab.on{opacity:1;transform:translateY(-4px) scale(1.08)}
.featured{display:flex;gap:6px;justify-content:center;background:#fff;border-radius:14px;padding:6px 8px;margin:10px 0 -6px;box-shadow:0 4px 12px rgba(20,40,90,.15);position:relative;z-index:2}
.featured>div{width:56px}
.featured .acard{width:100%}
.featured .acard.mega{animation:none}
#shop .packstage{margin-top:14px}
#shop .packname{margin:8px 0 0;font-size:22px;letter-spacing:.06em}
.packen{margin:0;font-family:var(--num);font-weight:900;font-style:italic;letter-spacing:.2em;font-size:11px;color:#6b7690}
.pprog{margin:4px 0 12px;font-family:var(--num);font-weight:900;color:#3a4a66;font-size:14px}
/* ずかん タブ */
.dtabs{display:flex;gap:6px;margin-bottom:10px}
.dtab{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px;border:3px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.6);text-align:left}
.dtab.on{background:#fff;box-shadow:0 4px 0 var(--ink)}
.dti{width:24px;flex:none}.dti svg{width:100%;height:auto;display:block}
.dtab b{display:block;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtab small{font-family:var(--num);font-weight:900;font-size:11px;color:var(--ink2)}
.dslot .slotnum{font-size:clamp(10px,3vw,15px)}
/* リアルな袋 */
.pack .ptop,.pack .pbody{box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.pack .pbody{border-radius:0 0 10px 10px}
.rim{position:absolute;left:-1%;right:-1%;top:calc(16% - 5px);height:12px;z-index:3;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,#fff,#d8e2f0);filter:drop-shadow(0 0 6px #8ff6ff) drop-shadow(0 0 14px rgba(140,240,255,.9));

/* ★5 キョダイ：ビルより 大きく 見える 奥行き */

  -webkit-mask:radial-gradient(circle at 50% 45%,transparent 6%,#000 16%,#000 60%,transparent 75%);mask:radial-gradient(circle at 50% 45%,transparent 6%,#000 16%,#000 60%,transparent 75%);animation:spin 16s linear infinite reverse}

function speak(text,rate=.85,onend){
  let done=false;const fin=()=>{if(done)return;done=true;onend&&onend()};
  if(!('speechSynthesis' in window)){setTimeout(fin,700);return}
  const SAY={'I':'eye','a (an)':'a, an','OK':'okay','live':'liv','P.E.':'P. E.','CD':'C. D.','watch TV':'watch T. V.','the U.K.':'the U. K.','TV':'T. V.','Mr.':'Mister','Ms.':'Miz','am':'am.'};
  const say=SAY[text]||text.replace(/\s*\(.*?\)/g,'').replace('P.E.','P E').replace('Mr.','Mister').replace('Ms.','Miz');
  const mk=()=>{const u=new SpeechSynthesisUtterance(say);u.lang='en-US';u.rate=rate;if(voice)u.voice=voice;return u};
  try{speechSynthesis.cancel();if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}

    setTimeout(()=>{if(!started&&!done&&tries<2){try{speechSynthesis.cancel()}catch(e){}setTimeout(go,80)}},1200)};

  if(onend)setTimeout(fin,600+text.length*260+2600);
}

  const take=r=>{const L=ids[r];const id=L.splice(Math.random()*L.length|0,1)[0];caps[r]--;return id};

let car={angle:0,target:0,R:0,ready:false,drag:false,spins:[],lastFront:0};
async function openPack(pi,bonus,got,before,bulk){
  const seen={};
  op={pk:pi,bonus,rare:bonus,got,before,idx:0,busy:true,bulk:bulk||0,isNew:got.map(id=>{const n=!before[id]&&!seen[id];seen[id]=1;return n})};
  $('open').classList.remove('hidden');setBg(0);$('fx').innerHTML='';$('dock').classList.remove('on');$('lifetime').classList.remove('on');
  const w=$('whiteout');w.classList.add('on');only();
  await wait(450);
  $('open').classList.toggle('special',!!bonus);buildCarousel(pi);only('carousel');
  w.classList.remove('on');SE.whoosh();
  await wait(1800);
  const ring=$('ring');ring.classList.remove('intro');car.angle=car.target=0;car.spins=Array(N_PACK).fill(0);car.lastFront=0;setRing(false);car.ready=true;requestAnimationFrame(carLoop);
  only('carousel','chint');
}
function buildCarousel(pi){
  const cw=Math.min(150,innerWidth*.38);car.R=cw*1.6;car.angle=0;car.ready=false;
  const ring=$('ring');ring.style.cssText=`--cw:${cw}px;--R:${car.R}px`;ring.className='ring intro';$('carousel').className='carousel';
  let h='';const art=packSVG(pi,op&&op.bonus),back=packBackSVG(pi);
  for(let k=0;k<N_PACK;k++)h+=`<div class="cpack" data-k="${k}" style="--cw:${cw}px;transform:rotateY(${k*STEP}deg) translateZ(${car.R}px)">
    <div class="spin"><div class="f">${art}</div><div class="b">${back}</div><div class="glint"></div></div>
    <div class="refl"><div class="rin">${art}</div></div></div>`;
  ring.innerHTML=h;
}
function setRing(){const r=$('ring');r.style.transition='none';r.style.transform=`translateZ(${-car.R}px) rotateY(${car.angle.toFixed(2)}deg)`}
function carLoop(){
  if(!car.ready&&!$('carousel').classList.contains('leave'))return;
  if($('carousel').classList.contains('hidden'))return;
  car.angle+=(car.target-car.angle)*(car.drag?.35:.12);setRing();
  const f=frontK(),settled=!car.drag&&Math.abs(car.target-car.angle)<1.5;
  if(f!==car.lastFront){car.lastFront=f;SE.tick()}
  document.querySelectorAll('#ring .spin').forEach((el,k)=>{
    let a=car.spins[k]||0;
    if(k===f&&settled)a+=.9;else{const t=Math.round(a/360)*360;a+=(t-a)*.12}
    car.spins[k]=a;el.style.transform=`rotateY(${a.toFixed(1)}deg)`;
  });
  requestAnimationFrame(carLoop);
}
function frontK(){return((Math.round(-car.target/STEP)%N_PACK)+N_PACK)%N_PACK}
function markFront(){const f=frontK();document.querySelectorAll('.cpack').forEach(p=>p.classList.toggle('front',+p.dataset.k===f))}
(function carouselControl(){
  const el=$('carousel');let x0=null,t0=0,lx=0,lt=0,vel=0,moved=false;
  el.addEventListener('pointerdown',e=>{if(!car.ready)return;x0=lx=e.clientX;lt=performance.now();t0=car.target;vel=0;moved=false;car.drag=true;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(x0==null)return;const now=performance.now(),dx=e.clientX-x0;if(Math.abs(dx)>8)moved=true;
    if(now>lt){vel=vel*.6+((e.clientX-lx)/(now-lt))*.4}lx=e.clientX;lt=now;car.target=t0+dx*.32});
  const up=()=>{if(x0==null)return;x0=null;car.drag=false;
    if(!moved){car.target=t0;choose();return}
    car.target=Math.round((car.target+vel*180*.32)/STEP)*STEP};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
})();
async function choose(){
  if(!car.ready)return;car.ready=false;unlockAudio();SE.select();
  const f=document.querySelector(`.cpack[data-k="${frontK()}"]`);document.querySelectorAll('.cpack').forEach(p=>p.classList.toggle('front',p===f));
  $('chint').classList.add('hidden');
  // えらんだパックが そのまま 大きくなって 開ける場面へ
  const face=f.querySelector('.f'),from=face.getBoundingClientRect();
  const fl=document.createElement('div');fl.className='flyer packfly';fl.innerHTML=packSVG(op.pk,op.bonus);
  fl.style.cssText=`left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;transform-origin:0 0;z-index:26`;
  $('open').appendChild(fl);f.style.opacity='0';
  $('carousel').classList.add('leave');
  showStage(true);$('carousel').classList.remove('hidden');
  const p=$('pack');p.style.visibility='hidden';const to=p.getBoundingClientRect();
  const dx=to.left-from.left,dy=to.top-from.top,sx=to.width/from.width,sy=to.height/from.height;
  await fl.animate([{transform:'none'},{transform:`translate(${dx*.45}px,${dy*.35-40}px) scale(${1+(sx-1)*.55},${1+(sy-1)*.55}) rotate(-2deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`}],
    {duration:720,easing:'cubic-bezier(.3,.7,.25,1)',fill:'forwards'}).finished;
  p.style.visibility='';fl.remove();$('carousel').classList.add('hidden');
}
